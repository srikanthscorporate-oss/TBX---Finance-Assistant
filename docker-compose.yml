# TBX Finance Assistant -- full stack.
#
# Network isolation follows plan.md section 34: nginx can reach the app tier but
# NOT the data tier, and no database port is published to the host in production.
# The `ports:` entries on data services are commented out deliberately -- keep
# them that way on the VPS and reach them via `docker compose exec`.

name: tbx

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # ---- Edge --------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:2024.10.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [edge]
    depends_on: [nginx]
    logging: *default-logging
    profiles: ["prod"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"          # local access; Cloudflare Tunnel is the prod path
    networks: [edge, app]
    depends_on: [api, web]
    logging: *default-logging

  # ---- Application -------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: tbx-api:${IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file: [.env]
    environment:
      TBX_ROLE: api
      TBX_EVAL_REPORT: /srv/evaluation/results/latest.json
    volumes:
      # Read-only so the dashboard reflects the latest local evaluation run
      # without the report being baked into the image.
      - ./evaluation/results:/srv/evaluation/results:ro
    ports:
      # Loopback only: for local evaluation runs that must bypass the public
      # rate limiter. Not reachable off-host and not routed through the tunnel.
      - "127.0.0.1:18000:8000"
    networks: [app, data, observability]
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres:   { condition: service_healthy }
      redis:      { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: tbx-api:${IMAGE_TAG:-dev}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      TBX_ROLE: worker
    networks: [app, data, observability]
    depends_on:
      redis: { condition: service_healthy }
    logging: *default-logging

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: tbx-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ''
      INTERNAL_API_BASE: http://api:8000
    networks: [app]
    logging: *default-logging

  # ---- Data tier ---------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CH_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD}
      CLICKHOUSE_DB: ${CH_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./infra/clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    networks: [data]
    ports: ["18123:8123"]   # local dev only; remove on the VPS
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-langfuse-db.sh:/docker-entrypoint-initdb.d/init-langfuse-db.sh:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:16379:6379"   # loopback only, for local evaluation runs
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [data, observability]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: { condition: service_healthy }
    networks: [data]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_EXPORTS} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_LANGFUSE} &&
      echo 'buckets ready'"
    env_file: [.env]
    restart: "no"

  # ---- Observability -----------------------------------------------------
  # Langfuse OSS. Given its own Postgres database and its own ClickHouse
  # database on the shared servers -- logically isolated from finance data.
  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${LANGFUSE_PG_DB}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CH_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${MINIO_BUCKET_LANGFUSE}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      NEXTAUTH_URL: https://${TBX_DOMAIN}/langfuse
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: tbx
      LANGFUSE_INIT_PROJECT_ID: tbx-finance
    networks: [observability, data]
    depends_on:
      postgres:   { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      minio:      { condition: service_healthy }
    logging: *default-logging
    profiles: ["observability"]

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${LANGFUSE_PG_DB}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CH_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${MINIO_BUCKET_LANGFUSE}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
    networks: [observability, data]
    depends_on:
      postgres:   { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    logging: *default-logging
    profiles: ["observability"]

networks:
  edge:
  app:
  data:
  observability:

volumes:
  clickhouse_data:
  postgres_data:
  redis_data:
  minio_data:
