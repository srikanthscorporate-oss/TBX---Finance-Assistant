server {
  listen 443 ssl;
  server_name ~^tbx-web\..+$;
  include /etc/nginx/conf.d/access-policy.conf;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  default_type application/json;
  return 503 '{"status":"pending","service":"tbx-web","message":"Application deployment has not been enabled yet."}\n';
}

