user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cloudflare terminates TLS and forwards through the tunnel, so the real
    # client address arrives in a header rather than the connection.
    map $http_cf_connecting_ip $real_client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    limit_req_zone $real_client_ip zone=chat:10m rate=30r/m;
    limit_req_zone $real_client_ip zone=general:10m rate=300r/m;

    include /etc/nginx/conf.d/*.conf;
}
