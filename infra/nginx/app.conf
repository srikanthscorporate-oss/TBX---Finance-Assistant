upstream tbx_api { server api:8000; keepalive 16; }
upstream tbx_web { server web:3000; keepalive 16; }

server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The UI loads only its own assets; no third-party scripts or frames.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Streaming: buffering here would defeat the live agent timeline entirely.
    location /api/v1/chat/stream {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass http://tbx_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 120s;
        gzip off;
    }

    location /api/v1/chat {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass http://tbx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Observability is intentionally public.
    #
    # This build has no end-user authentication (explicitly out of scope for the
    # brief), and the metrics here are operational counters about the assistant
    # itself -- token spend, latency, model mix, evaluation accuracy. They expose
    # no financial records. If auth is ever added, put Cloudflare Access in front
    # of this location; a source-IP allowlist cannot work behind a tunnel, since
    # all traffic arrives from a Docker-internal address.
    location /api/v1/admin {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://tbx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Data Source: validating a user-supplied MySQL endpoint dials out to that
    # server, so it needs a longer read timeout than a normal API call and a
    # tighter rate limit than browsing.
    location /api/v1/sources {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://tbx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://tbx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://tbx_api/health;
        access_log off;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://tbx_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
