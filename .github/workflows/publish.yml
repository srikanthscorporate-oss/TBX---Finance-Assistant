name: Publish images

# Pushes both application images to Docker Hub on every merge to main, tagged
# with the commit SHA and latest. Needs two repository secrets:
#   DOCKERHUB_USERNAME  (srikanthsdocker)
#   DOCKERHUB_TOKEN     (an access token, not the account password)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        run: docker compose build api web
      - name: Push (sha + latest)
        env:
          DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: ./scripts/push_images.sh
